# Fronts the tunnel with a login - see docker-compose.yml's
# chainlp-tunnel-auth service comment for why this is a separate nginx
# instance rather than added directly to nginx.conf. Everything that
# passes the login below is then forwarded on to chainlp-proxy, so the
# chart-title fix in nginx.conf still applies to tunnel traffic too.
server {
    listen 80;

    # Same reasoning as chainlp-proxy's own nginx.conf: nginx's 1m
    # default is too small for a real test's payload once it includes a
    # screenshot or verbose log, and gets rejected outright with 413.
    # Confirmed against a real push through this exact tunnel: chainlp-proxy
    # already had this raised, but this separate nginx instance - being a
    # distinct hop in front of it - needed its own copy of the same fix.
    client_max_body_size 20m;

    location / {
        auth_basic "ChainLP (remote access)";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://chainlp-proxy:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
