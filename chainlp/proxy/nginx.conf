server {
    listen 80;

    # nginx's own default (1m) is too small for a real test's ChainTest
    # payload once it includes a failure screenshot or a verbose log -
    # confirmed against a real push that nginx rejected outright with
    # 413 Request Entity Too Large, which chaintest-core's client then
    # surfaces as a JSON parse error (it got nginx's HTML error page
    # back instead of the JSON response it expected). 20m comfortably
    # covers a single test's worth of screenshots/logs; raise further if
    # your own tests attach larger media.
    client_max_body_size 20m;

    location / {
        # A static `proxy_pass http://chainlp:80;` resolves that hostname
        # once, at nginx config-load time - if Docker's embedded DNS
        # (127.0.0.11 on every user-defined bridge network) hasn't
        # finished registering the chainlp container's network alias in
        # that exact instant, nginx fails permanently with "host not
        # found in upstream" and the container crashes outright, with no
        # retry. Confirmed directly, repeatedly, on a freshly created
        # network even with `depends_on: chainlp: condition:
        # service_healthy` already satisfied - a real startup race, not a
        # rare edge case. A variable in proxy_pass forces per-request
        # resolution through the resolver below instead, so a request
        # arriving before that first resolution succeeds just retries
        # rather than taking the whole container down with it.
        resolver 127.0.0.11 valid=10s;
        set $chainlp_backend http://chainlp:80;
        proxy_pass $chainlp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support, in case a future ChainLP version
        # relies on it for its real-time UI - a harmless no-op for the
        # plain HTTP requests it uses today.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Force uncompressed responses from ChainLP so sub_filter below
        # always sees plain text to match against, regardless of whether
        # a future ChainLP version turns on server-side compression.
        proxy_set_header Accept-Encoding "";

        # Never let a 304 Not Modified through - sub_filter has nothing to
        # substitute in an empty body, and a browser or intermediate cache
        # holding the unpatched bundle from before this proxy existed
        # would otherwise keep being served indefinitely.
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";

        # Adds a "katalon" entry to ChainLP's own hardcoded chart-title
        # lookup table (BuildComponent's _titles map, in its compiled
        # frontend bundle) so the build-detail page's 3 summary charts
        # render for Katalon-produced builds instead of the whole summary
        # section silently failing to render (ChainLP only recognizes
        # testng/junit/junit5/cucumber-jvm there). See this folder's
        # README.md "Known limitation" section for the full story.
        #
        # This is a plain substring substitution on ChainLP's own
        # already-compiled JS response - not a fork or rebuild of
        # ChainLP's source, and not tied to a specific bundle filename
        # (those are content-hashed and change on every ChainLP release).
        # If a future ChainLP version reformats this object, the
        # substitution just stops matching and the page reverts to
        # today's default (blank summary boxes) - it cannot corrupt or
        # break the response either way.
        sub_filter 'testng:["Suite","Class","Method"]' 'testng:["Suite","Class","Method"],katalon:["Suite","Test Case","Step"]';
        sub_filter_once on;
        sub_filter_types application/javascript text/javascript application/x-javascript;
    }
}
