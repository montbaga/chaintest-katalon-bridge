# ChainTest-Katalon Bridge configuration
# ------------------------------------------------------------------
# Every key here can be overridden without touching this file by setting
# an environment variable named CHAINTEST_<KEY_IN_UPPER_SNAKE_CASE>, with
# both dots and hyphens folded to underscores, e.g.
#   chaintest.bridge.results.dir              -> CHAINTEST_BRIDGE_RESULTS_DIR
#   chaintest.generator.simple.output-file     -> CHAINTEST_GENERATOR_SIMPLE_OUTPUT_FILE
#   chaintest.generator.chainlp.host.url       -> CHAINTEST_GENERATOR_CHAINLP_HOST_URL
# This lets each CI environment (Jenkins, Azure Pipelines, local dev)
# point results wherever it needs to without forking this file.

# ==================================================================
# Bridge settings - read by this bridge only, never seen by ChainTest
# itself.
# ==================================================================

# Master switch. Set to false to disable ChainTest reporting entirely
# (e.g. for a quick local debug run) without removing the listener.
chaintest.bridge.enabled=true

# Where intermediate per-test-case JSON records are written before being
# assembled into the final report. Relative paths are resolved against
# the Katalon project root. Nothing here is meant to be read directly -
# it's this bridge's own working storage.
chaintest.bridge.results.dir=chaintest-results

# true (default): delete this folder's leftover intermediate records from
# an earlier, unrelated run before writing new ones. Does NOT clear
# between the Test Suites of one Test Suite Collection run (they all
# share the same Reports/<timestamp> folder, which is how a "new run" is
# detected) - those are meant to combine into one report. Set to false if
# you run multiple *unrelated* suites in true parallel against this same
# folder - a suite starting mid-run could otherwise wipe another suite's
# still-in-progress results.
chaintest.bridge.clean.results.before.run=true

# Attach a screenshot automatically when a test case does NOT pass. Only
# takes effect if a WebUI browser session is active; silently skipped for
# API/Mobile-only test cases.
chaintest.bridge.attach.screenshot.on.failure=true

# Attach a screenshot for every test case, pass or fail. Off by default -
# ChainTest's static report embeds screenshots as separate resource
# files (not inline base64), but this still adds noise to large WebUI
# suites.
chaintest.bridge.attach.screenshot.always=false

# true (default): automatically turn each test case's own Katalon
# execution log (every keyword/script line it already records, complete
# with pass/fail per line) into nested ChainTest steps - no test script
# changes needed. This reads an already-written, already-closed log file
# per test case, so it can never affect the actual test outcome.
chaintest.bridge.capture.steps=true

# Path (relative to project root, or absolute) to the failure-tags.json
# template that tags a failed/broken test case based on its message -
# matched via regex, then applied via ChainTest's own Tag system, visible
# as filterable tag chips in the report.
chaintest.bridge.tags.file=Include/config/chaintest/failure-tags.json

# Base folder the static HTML report is written under. Each run gets its
# own "<Name>_<yyyyMMdd_HHmmss>/" folder here so repeated runs don't
# overwrite each other. <Name> is a Test Suite Collection's name if you
# ran one, otherwise the Test Suite's name. The report only generates
# once every suite in the current run has finished, and a Test Suite
# Collection produces exactly one combined report, not one per Test
# Suite. Relative paths are resolved against the Katalon project root.
chaintest.bridge.report.dir=chaintest-report

# ==================================================================
# ChainTest-native settings - forwarded to ChainTest's own generators
# using its own property names (see Config.md in the ChainTest project).
# ==================================================================

# Shown in the report footer and (if ChainLP is enabled) used to group
# builds server-side. Left unset by default - the bridge auto-detects
# your actual Katalon project name (RunConfiguration.getProjectName())
# and uses that. Uncomment and set a value here only if you want to
# override it with something else.
#chaintest.project.name=

# The static, self-contained HTML report (ChainTestSimpleGenerator). This
# is what makes the bridge zero-touch - on by default, no server, no
# Docker. Turn off only if you exclusively want ChainLP below.
chaintest.generator.simple.enabled=true

# true (default): copies the CSS/JS/font resources ChainTest ships inside
# its own jar into a sibling "resources/" folder next to Index.html, so
# the report opens straight from file:// without needing a local server.
# One caveat, inherent to ChainTest's own template rather than anything
# this bridge does: even in offline mode, the report's <head> still
# references a Google Fonts stylesheet for its heading font. The report
# still renders correctly with no internet access - it just falls back
# to a system font - so this is not a network dependency in practice.
chaintest.generator.simple.offline=true

# "false" (default) or "true" - the static report's colour theme.
chaintest.generator.simple.dark-theme=false

chaintest.generator.simple.datetime-format=yyyy-MM-dd HH:mm:ss a

# Optional custom JS/CSS injected into the static report. Left empty by
# default - do not delete these two keys even if unused: ChainTest's own
# SimpleGenerator throws a NullPointerException at report-generation time
# if either is absent from its configuration rather than set to an empty
# string.
chaintest.generator.simple.js=
chaintest.generator.simple.css=

# ChainLP: ChainTest's optional real-time analytics/historical-trend
# server. Off by default - unlike the static report above, this needs a
# running server (see chainlp/ in this bridge's own repository for a
# ready-to-run Docker Compose setup). Turning this on does not disable
# the static report; both can run side by side from the same test run.
chaintest.generator.chainlp.enabled=false

# Trailing slash matters - ChainTest resolves API paths by appending onto
# this URL directly. 8085 matches this bridge's own chainlp/docker-compose.yml
# out of the box - change this only if you moved that port, or are
# pointing at a different ChainLP entirely (see chainlp/README.md).
chaintest.generator.chainlp.host.url=http://localhost:8085/

# true (default): screenshots are uploaded to ChainLP too, not just
# embedded in the static report.
chaintest.generator.chainlp.persist-embeds=true

chaintest.generator.chainlp.client.request-timeout-s=30
chaintest.generator.chainlp.client.max-retries=3
chaintest.generator.chainlp.client.retry-interval-ms=1000
chaintest.generator.chainlp.client.expect-continue=false

# Kept false regardless of ChainTest's own upstream default: a ChainLP
# outage must never be allowed to affect the real Katalon test result.
chaintest.generator.chainlp.client.throw-after-retry-attempts-exceeded=false
